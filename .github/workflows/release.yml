name: Build & Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend (Vue 3 SPA)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Go binary (linux/amd64, static)
        run: |
          cd src
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w" \
            -o ../linux-service-manager-linux-amd64 \
            main.go

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-service-manager-linux-amd64
          fail_on_unmatched_files: true
