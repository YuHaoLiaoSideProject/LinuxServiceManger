{{define "login"}}
<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 - Linux Service Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box}

    /* ── CSS Variables ── */
    :root {
      --lms-accent: #1a73e8;
      --lms-accent-hover: #1557b0;
      --lms-danger: #c5221f;
      --lms-danger-light: #fce8e6;
      --lms-danger-border: #f5c6c2;
    }

    /* ── Accessibility: prefers-reduced-motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── Layout ── */
    .login-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: var(--pico-background-color);
      transition: background 0.3s ease;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      background: var(--pico-card-background-color);
      border: 1px solid var(--pico-card-border-color);
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      transition: box-shadow 0.3s ease, background 0.3s ease;
    }

    /* ── Brand ── */
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-brand .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--lms-accent), var(--lms-accent-hover));
      color: #fff;
      font-size: 2rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 12px rgba(26,115,232,0.3);
    }
    .login-brand h1 {
      font-size: 1.4rem;
      margin: 0 0 0.25rem;
      color: var(--pico-h1-color);
    }
    .login-brand p {
      margin: 0;
      font-size: 0.875rem;
      color: var(--pico-muted-color);
    }

    /* ── Input focus animation ── */
    .login-card input[type="text"],
    .login-card input[type="password"] {
      transition: border-color 0.2s ease, box-shadow 0.25s ease, background 0.2s ease;
      border: 2px solid var(--pico-form-element-border-color);
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      font-size: 1rem;
      background: var(--pico-form-element-background-color);
    }
    .login-card input:focus {
      border-color: var(--lms-accent);
      box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
      outline: none;
    }
    .login-card input:focus-visible {
      border-color: var(--lms-accent);
      box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
      outline: none;
    }

    /* ── Submit button ── */
    .login-card button[type="submit"] {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .login-card button[type="submit"]:active:not(.htmx-request) {
      transform: scale(0.97);
    }
    .login-card button[type="submit"]:focus-visible {
      outline: 2px solid var(--lms-accent);
      outline-offset: 2px;
    }
    .login-card button[type="submit"]:not(.htmx-request) .btn-spinner {
      display: none;
    }
    .login-card button[type="submit"].htmx-request {
      pointer-events: none;
      opacity: 0.8;
    }
    .login-card button[type="submit"].htmx-request .btn-text {
      visibility: hidden;
    }
    .login-card button[type="submit"].htmx-request .btn-spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Spinner ── */
    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    #login-error {
      min-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
    }
    #login-error:empty {
      margin: 0;
    }
    .login-error-msg {
      background: var(--lms-danger-light);
      color: var(--lms-danger);
      border: 1px solid var(--lms-danger-border);
      border-left: 4px solid var(--lms-danger);
      padding: 0.65rem 1rem;
      border-radius: 8px;
      margin: 0.75rem 0;
      font-size: 0.875rem;
      font-weight: 500;
      animation: errorSlideIn 0.35s ease-out;
    }
    @keyframes errorSlideIn {
      from { opacity: 0; transform: translateY(-10px); max-height: 0; }
      to   { opacity: 1; transform: translateY(0); max-height: 60px; }
    }

    /* ── Dark mode toggle ── */
    .theme-toggle-wrap {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.5rem;
    }
    .theme-toggle {
      background: none;
      border: 1px solid var(--pico-muted-border-color);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
      color: var(--pico-color);
    }
    .theme-toggle:hover {
      background: var(--pico-muted-border-color);
    }
    .theme-toggle:focus-visible {
      outline: 2px solid var(--lms-accent);
      outline-offset: 2px;
    }
    .theme-toggle:active {
      transform: scale(0.92);
    }

    /* ── Pico dark overrides ── */
    [data-theme="dark"] .login-card {
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    [data-theme="dark"] .login-error-msg {
      background: rgba(197,34,31,0.15);
      border-color: rgba(197,34,31,0.3);
      color: #f2a19d;
    }
    [data-theme="dark"] .login-card input:focus {
      box-shadow: 0 0 0 3px rgba(138,180,248,0.2);
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.25rem;
        border-radius: 12px;
      }
      .login-brand .brand-icon {
        width: 52px;
        height: 52px;
        font-size: 1.6rem;
      }
      .login-brand h1 { font-size: 1.2rem; }
      .login-brand p { font-size: 0.8rem; }
    }

    /* ── Small mobile (< 420px) ── */
    @media (max-width: 419px) {
      .login-page {
        padding: 0.5rem;
        align-items: flex-start;
        padding-top: 2rem;
      }
      .login-card {
        padding: 1.5rem 1rem;
        border-radius: 12px;
      }
      .login-brand {
        margin-bottom: 1.25rem;
      }
      .login-brand .brand-icon {
        width: 44px;
        height: 44px;
        font-size: 1.3rem;
        border-radius: 12px;
        margin-bottom: 0.6rem;
      }
      .login-brand h1 { font-size: 1.1rem; }
      .login-brand p { font-size: 0.75rem; }
      .login-card input[type="text"],
      .login-card input[type="password"] {
        font-size: 0.9rem;
        padding: 0.55rem 0.75rem;
        min-height: 44px;
        border-radius: 8px;
      }
      .login-card button[type="submit"] {
        font-size: 0.95rem;
        padding: 0.65rem;
        min-height: 44px;
        border-radius: 8px;
      }
      .login-error-msg {
        font-size: 0.8rem;
        padding: 0.5rem 0.75rem;
      }
      .theme-toggle-wrap {
        margin-bottom: 0.25rem;
      }
    }
  </style>
</head>
<body class="login-page">
  <div class="login-card">
    <!-- Dark mode toggle -->
    <div class="theme-toggle-wrap">
      <button class="theme-toggle" id="theme-toggle-btn" aria-label="切換深色模式" type="button" title="切換深色模式">
        <span class="theme-icon-light" aria-hidden="true">☀️</span>
        <span class="theme-icon-dark" aria-hidden="true" style="display:none">🌙</span>
      </button>
    </div>

    <!-- Brand -->
    <div class="login-brand">
      <div class="brand-icon" aria-hidden="true">🖥</div>
      <h1>Linux Service Manager</h1>
      <p>請登入以管理您的系統服務</p>
    </div>

    <!-- Login form -->
    <form hx-post="/login" hx-target="#login-error" hx-swap="innerHTML" hx-indicator="closest form">
      <label for="username">
        帳號
        <input type="text" id="username" name="username" required autofocus
               autocomplete="username" placeholder="請輸入帳號"
               aria-label="帳號">
      </label>
      <label for="password">
        密碼
        <input type="password" id="password" name="password" required
               autocomplete="current-password" placeholder="請輸入密碼"
               aria-label="密碼">
      </label>
      <div id="login-error"></div>
      <button type="submit" aria-label="登入">
        <span class="btn-text">登入</span>
        <span class="btn-spinner"><span class="spinner"></span></span>
      </button>
    </form>
  </div>

  <script>
    (function() {
      // ── Dark mode ──
      const html = document.documentElement;
      const btn = document.getElementById('theme-toggle-btn');
      const iconLight = btn.querySelector('.theme-icon-light');
      const iconDark = btn.querySelector('.theme-icon-dark');

      function setTheme(dark) {
        html.setAttribute('data-theme', dark ? 'dark' : 'light');
        iconLight.style.display = dark ? 'none' : '';
        iconDark.style.display = dark ? '' : 'none';
        try { localStorage.setItem('lms-theme', dark ? 'dark' : 'light'); } catch(e) {}
      }

      function toggleTheme() {
        setTheme(html.getAttribute('data-theme') !== 'dark');
      }

      // Init from localStorage
      try {
        const saved = localStorage.getItem('lms-theme');
        if (saved) setTheme(saved === 'dark');
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme(true);
      } catch(e) {}

      btn.addEventListener('click', toggleTheme);

      // ── htmx error handling ──
      document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'login-error') {
          const el = evt.detail.target;
          // Wrap error content if needed
          const div = el.querySelector('div');
          if (div && !div.classList.contains('login-error-msg')) {
            div.classList.add('login-error-msg');
          }
        }
      });
    })();
  </script>
</body>
</html>
{{end}}
